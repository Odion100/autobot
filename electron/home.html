<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>autobot</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        background: radial-gradient(ellipse 90% 70% at 50% 30%, #10151d 0%, #0b0e13 65%);
        color: #e6e8eb;
        font-family: -apple-system, "SF Pro Text", Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      main { width: min(560px, 86vw); text-align: center; }
      .mark { filter: drop-shadow(0 0 22px rgba(124, 196, 255, 0.5)); }
      h1 {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.22em;
        color: #7cc4ff;
        margin: 14px 0 34px;
      }
      form { position: relative; }
      input {
        width: 100%;
        height: 46px;
        border: 1px solid #1c232e;
        border-radius: 23px;
        background: #10151d;
        color: #e6e8eb;
        padding: 0 22px;
        font-size: 14.5px;
        outline: none;
      }
      input::placeholder { color: #4a5361; }
      input:focus { border-color: #2b5f8f; box-shadow: 0 0 0 3px rgba(43, 95, 143, 0.25); }
      .apps { display: flex; justify-content: center; gap: 14px; margin-top: 38px; }
      .app {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 18px;
        border-radius: 12px;
        background: #10151d;
        border: 1px solid #1c232e;
        color: #9aa3ad;
        cursor: pointer;
        font-size: 13px;
      }
      .app:hover { border-color: #2b5f8f; color: #e6e8eb; }
      .dot { width: 9px; height: 9px; border-radius: 3px; background: #7cc4ff; }
      .hint { margin-top: 44px; font-size: 11px; color: #3a4250; letter-spacing: 0.06em; }
      kbd {
        background: #10151d;
        border: 1px solid #1c232e;
        border-radius: 4px;
        padding: 1px 5px;
        font-family: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" width="72" height="72" viewBox="0 0 100 100">
        <g fill="#7cc4ff" transform="rotate(18 50 50)">
          <path d="M50 2 C56 36 64 44 98 50 C64 56 56 64 50 98 C44 64 36 56 2 50 C36 44 44 36 50 2 Z" />
          <path d="M78 6 C80 16 84 20 94 22 C84 24 80 28 78 38 C76 28 72 24 62 22 C72 20 76 16 78 6 Z" opacity="0.85" />
          <path d="M20 68 C21.5 74 24 76.5 30 78 C24 79.5 21.5 82 20 88 C18.5 82 16 79.5 10 78 C16 76.5 18.5 74 20 68 Z" opacity="0.7" />
        </g>
      </svg>
      <h1>autobot</h1>
      <form id="go">
        <input id="q" placeholder="search the web, or enter an address" spellcheck="false" autofocus />
      </form>
      <div class="apps" id="apps"></div>
      <p class="hint"><kbd>⌘B</kbd> apps &amp; tabs &nbsp;·&nbsp; <kbd>F12</kbd> devtools &nbsp;·&nbsp; the agent moves in with the IDE milestone</p>
    </main>
    <script>
      document.getElementById("go").addEventListener("submit", (e) => {
        e.preventDefault();
        const v = document.getElementById("q").value.trim();
        if (v) window.autobotHome?.go(v);
      });
      (async () => {
        const apps = (await window.autobotHome?.apps()) ?? [];
        const row = document.getElementById("apps");
        for (const a of apps) {
          const el = document.createElement("div");
          el.className = "app";
          el.innerHTML = '<span class="dot"></span>' + a.title;
          el.addEventListener("click", () => window.autobotHome.openApp(a.id));
          row.appendChild(el);
        }
      })();
    </script>
  </body>
</html>
